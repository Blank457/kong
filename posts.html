<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 — Lin Chen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<div class="bg-scroll">
  <div class="bg-slide" style="background-image:url('img/背景.jpg')"></div>
  <div class="bg-slide" style="background-image:url('img/背景 (1).jpg')"></div>
  <div class="bg-slide" style="background-image:url('img/背景 (2).jpg')"></div>
  <div class="bg-slide" style="background-image:url('img/背景 (3).jpg')"></div>
  <div class="bg-slide" style="background-image:url('img/背景 (4).jpg')"></div>
  <div class="bg-slide" style="background-image:url('img/背景 (5).jpg')"></div>
  <div class="bg-slide" style="background-image:url('img/背景 (6).jpg')"></div>
  <div class="bg-slide" style="background-image:url('img/背景 (7).jpg')"></div>
</div>
<div class="bg-overlay"></div>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark"></span>
      <span>Lin Chen</span>
    </a>
    <div class="nav-links">
      <a href="about.html">关于</a>
      <a href="posts.html" class="active">文章</a>
      <a href="projects.html">项目</a>
      <a href="music.html">音乐</a>

    </div>
    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a href="about.html#contact" class="nav-cta">订阅 RSS</a>
    </div>
  </div>
</nav>

<main>

  <section class="page-head">

    <h1>所有文章</h1>
    <p class="sub" id="postSub">关于前端工程、界面设计、动画性能与开发体验的写作。</p>
    <div style="margin-top: 28px;">
      <button class="btn-add" onclick="openModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新增文章
      </button>
    </div>
  </section>

  <section class="posts reveal" style="margin-bottom: 60px;">
    <div id="postList" class="post-list"></div>
  </section>

  <!-- 回收站 -->
  <section class="reveal" id="trashSection" style="margin-bottom: 100px; display: none;">
    <div class="section-head">
      <h2>回收站</h2>
      <span class="meta">// 24小时内可恢复</span>
    </div>
    <div id="trashList" class="post-list"></div>
  </section>

</main>

<!-- 新增文章对话框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>新增文章</h3>
      <button class="modal-close" onclick="closeModal()" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>标题</label>
        <input class="modal-input" id="fTitle" placeholder="例如：拆解 Linear 的滚动动画" maxlength="60">
      </div>
      <div class="modal-field">
        <label>描述</label>
        <textarea class="modal-textarea" id="fDesc" placeholder="一句话介绍这篇文章" maxlength="160"></textarea>
      </div>
      <div class="modal-field">
        <label>日期（格式：MM·DD）</label>
        <input class="modal-input" id="fDate" placeholder="10·06" maxlength="5">
      </div>
      <div class="modal-field">
        <label>标签（逗号分隔，可选）</label>
        <input class="modal-input" id="fTags" placeholder="动画, React, 性能">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-submit" onclick="submitPost()">添加</button>
    </div>
  </div>
</div>

<!-- 确认删除对话框 -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal" style="width: 400px;">
    <div class="modal-head">
      <h3>确认删除</h3>
      <button class="modal-close" onclick="closeConfirm()" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p id="confirmMsg" style="font-size:14px;color:var(--text-muted);line-height:1.7;margin:0;">确定要删除这篇文章吗？文章将移入回收站，24小时内可恢复。</p>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeConfirm()">取消</button>
      <button class="btn-submit" style="background:linear-gradient(135deg,#EF4444,#DC2626);border-color:rgba(239,68,68,0.4);box-shadow:0 0 16px rgba(239,68,68,0.2);" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <span>© 2026 Lin Chen — Crafted with care.</span>
    <span class="mono">v1.0.0 · built with HTML/CSS</span>
  </div>
</footer>

<script src="player.js"></script>
<script>
  // 背景动画跨页面延续
  (function() {
    var D = 48000, slides = document.querySelectorAll('.bg-slide');
    if (!slides.length) return;
    var start = parseFloat(localStorage.getItem('bgAnimStart'));
    var now = Date.now();
    if (!start || isNaN(start)) { start = now; localStorage.setItem('bgAnimStart', String(start)); }
    var off = ((now - start) % D) / 1000;
    var base = [0, -6, -12, -18, -24, -30, -36, -42];
    slides.forEach(function(s, i) { s.style.animationDelay = (base[i] - off) + 's'; });
  })();

  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  let down = false;
  window.addEventListener('scroll', () => {
    const next = window.scrollY > 20;
    if (next !== down) {
      down = next;
      document.body.classList.toggle('scrolled', down);
    }
  }, { passive: true });

  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  }

  /* ====== 文章增删逻辑 ====== */
  var DEFAULT_POSTS = [
    { id: 1, date: '10·06', title: '拆解 Linear 的滚动动画：从弹簧物理到帧预算', desc: '逐帧分析 Linear 如何在 60fps 内实现丝滑的列表动画，以及如何在 React 中复刻。', tags: ['动画','React','性能'] },
    { id: 2, date: '09·22', title: '用 CSS conic-gradient 做出高级感进度环', desc: '不依赖任何库，纯 CSS 实现可交互的环形进度指示器，附设计思路拆解。', tags: ['CSS','设计'] },
    { id: 3, date: '09·08', title: 'View Transitions API 实战：给 SPA 加上原生级页面切换', desc: '浏览器原生支持的跨页面动画 API，比任何路由动画库都更轻量。兼容性与降级方案一并讲清。', tags: ['API','动画'] },
    { id: 4, date: '08·19', title: '设计系统的 token 命名：一份来自实践的经验清单', desc: '命名是设计系统最难的部分。本文整理了 20 条从真实项目里沉淀出的命名约定。', tags: ['设计系统','Token'] },
    { id: 5, date: '08·03', title: '为什么我不再滥用 backdrop-filter', desc: '毛玻璃很美，但性能代价不低。一次性能复盘让我重新审视它的使用边界。', tags: ['CSS','性能'] },
    { id: 6, date: '07·21', title: '用 Container Queries 重写响应式组件', desc: '媒体查询的时代正在过去。基于组件自身尺寸的查询让可复用组件真正独立。', tags: ['CSS','响应式'] },
    { id: 7, date: '07·05', title: 'React Server Components 里的动画：哪些能做，哪些不能', desc: 'RSC 改变了前端动画的边界。本文梳理在服务端组件中可行的动画策略。', tags: ['React','RSC','动画'] },
    { id: 8, date: '06·18', title: '从零搭建一个 Monorepo 的 Storybook 工作流', desc: 'Turborepo + pnpm + Storybook 的组合实践，附 CI 配置与组件共享方案。', tags: ['工程化','Monorepo'] },
    { id: 9, date: '06·02', title: 'CSS @scope：级联控制的新时代', desc: '原生作用域控制终于来了。和 CSS Modules、Shadow DOM 比起来它有什么不同？', tags: ['CSS'] },
    { id: 10, date: '05·14', title: '做了一次首屏性能审计，LCP 从 3.8s 降到 1.2s', desc: '记录一次完整的性能优化过程：从测量、定位、到每一项优化的收益量化。', tags: ['性能','LCP'] }
  ];

  function loadPosts() {
    try { var s = localStorage.getItem('posts'); if (s) return JSON.parse(s); } catch(e) {}
    return DEFAULT_POSTS.slice();
  }
  function savePosts(list) { localStorage.setItem('posts', JSON.stringify(list)); }

  function esc(s) { return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function renderPosts() {
    var list = loadPosts();
    var container = document.getElementById('postList');
    document.getElementById('postSub').textContent = '关于前端工程、界面设计、动画性能与开发体验的写作。共 ' + list.length + ' 篇，按时间倒序排列。';
    if (!list.length) {
      container.className = '';
      container.innerHTML = '<div class="empty-state">还没有文章，点击上方"新增文章"添加第一篇吧。</div>';
      return;
    }
    container.className = 'post-list';
    var html = '';
    list.forEach(function(p) {
      var tagsHtml = (p.tags || []).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join(' ');
      html += '<div class="post" onclick="location.href=\'post.html\'" style="cursor:pointer;">' +
        '<button class="pc-delete" onclick="event.stopPropagation();deletePost(' + p.id + ')" aria-label="删除">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>' +
        '</button>' +
        '<span class="date">' + esc(p.date) + '</span>' +
        '<div class="body">' +
          '<div class="title">' + esc(p.title) + '</div>' +
          '<div class="desc">' + esc(p.desc || '') + (tagsHtml ? ' ' + tagsHtml : '') + '</div>' +
        '</div>' +
        '<span class="arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span>' +
      '</div>';
    });
    container.innerHTML = html;
  }

  function defaultDate() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return m + '·' + day;
  }

  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('fDate').value = defaultDate();
    document.getElementById('fTitle').focus();
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('fTitle').value = '';
    document.getElementById('fDesc').value = '';
    document.getElementById('fDate').value = '';
    document.getElementById('fTags').value = '';
  }
  function submitPost() {
    var title = document.getElementById('fTitle').value.trim();
    if (!title) { document.getElementById('fTitle').focus(); return; }
    var desc = document.getElementById('fDesc').value.trim();
    var date = document.getElementById('fDate').value.trim() || defaultDate();
    var tags = document.getElementById('fTags').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    var list = loadPosts();
    var id = list.length ? Math.max.apply(null, list.map(function(p){return p.id;})) + 1 : 1;
    list.unshift({ id: id, date: date, title: title, desc: desc, tags: tags });
    savePosts(list);
    closeModal();
    renderPosts();
  }
  var pendingDeleteId = null;
  function deletePost(id) {
    pendingDeleteId = id;
    var list = loadPosts();
    var p = list.find(function(x){return x.id === id;});
    if (p) document.getElementById('confirmMsg').textContent = '确定要删除「' + p.title + '」吗？文章将移入回收站，24小时内可恢复。';
    document.getElementById('confirmOverlay').classList.add('open');
  }
  function confirmDelete() {
    if (pendingDeleteId !== null) {
      var list = loadPosts();
      var p = list.find(function(x){return x.id === pendingDeleteId;});
      if (p) {
        var trash = loadTrash();
        trash.push({ post: p, deletedAt: Date.now() });
        saveTrash(trash);
      }
      savePosts(list.filter(function(x){return x.id !== pendingDeleteId;}));
      pendingDeleteId = null;
      renderPosts();
      renderTrash();
    }
    closeConfirm();
  }
  function closeConfirm() {
    document.getElementById('confirmOverlay').classList.remove('open');
    pendingDeleteId = null;
  }

  /* ====== 回收站逻辑 ====== */
  var TRASH_KEY = 'postTrash';
  var TRASH_TTL = 24 * 60 * 60 * 1000;

  function loadTrash() {
    try { var s = localStorage.getItem(TRASH_KEY); if (s) return JSON.parse(s); } catch(e) {}
    return [];
  }
  function saveTrash(list) { localStorage.setItem(TRASH_KEY, JSON.stringify(list)); }

  function purgeExpired() {
    var trash = loadTrash();
    var now = Date.now();
    var valid = trash.filter(function(t){ return (now - t.deletedAt) < TRASH_TTL; });
    if (valid.length !== trash.length) saveTrash(valid);
    return valid;
  }

  function fmtRemaining(ms) {
    if (ms <= 0) return '已过期';
    var h = Math.floor(ms / 3600000);
    var m = Math.floor((ms % 3600000) / 60000);
    var s = Math.floor((ms % 60000) / 1000);
    if (h > 0) return h + '小时' + m + '分后彻底删除';
    if (m > 0) return m + '分' + s + '秒后彻底删除';
    return s + '秒后彻底删除';
  }

  function renderTrash() {
    var trash = purgeExpired();
    var section = document.getElementById('trashSection');
    var list = document.getElementById('trashList');
    if (!trash.length) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    var now = Date.now();
    var html = '';
    trash.forEach(function(t) {
      var p = t.post;
      var remaining = TRASH_TTL - (now - t.deletedAt);
      var tags = (p.tags || []).map(function(s){ return '<span class="tag">' + esc(s) + '</span>'; }).join(' ');
      html += '<div class="post" style="cursor:default;">' +
        '<span class="date mono" style="color:#F59E0B;">' + fmtRemaining(remaining) + '</span>' +
        '<div class="body">' +
          '<div class="title">' + esc(p.title) + '</div>' +
          '<div class="desc">' + esc(p.desc || '') + ' ' + tags + '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;">' +
          '<button class="btn-cancel" style="padding:6px 14px;font-size:12px;" onclick="restorePost(' + p.id + ')">恢复</button>' +
          '<button class="btn-cancel" style="padding:6px 14px;font-size:12px;color:#EF4444;border-color:rgba(239,68,68,0.3);" onclick="purgePost(' + p.id + ')">彻底删除</button>' +
        '</div>' +
      '</div>';
    });
    list.innerHTML = html;
  }

  function restorePost(id) {
    var trash = loadTrash();
    var item = trash.find(function(t){return t.post.id === id;});
    if (item) {
      var list = loadPosts();
      list.unshift(item.post);
      savePosts(list);
    }
    saveTrash(trash.filter(function(t){return t.post.id !== id;}));
    renderPosts();
    renderTrash();
  }

  function purgePost(id) {
    saveTrash(loadTrash().filter(function(t){return t.post.id !== id;}));
    renderTrash();
  }

  setInterval(function() {
    var section = document.getElementById('trashSection');
    if (section && section.style.display !== 'none') renderTrash();
  }, 1000);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeModal(); closeConfirm(); }
  });
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.getElementById('confirmOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeConfirm();
  });

  purgeExpired();
  renderPosts();
  renderTrash();
</script>

</body>
</html>
